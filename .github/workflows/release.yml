name: Publish desktop + Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm the tag matches the app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Prepare optional code signing (SmartScreen trust)
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WIN_CERT -and $env:WIN_CERT.Trim()) {
            "CSC_LINK=$env:WIN_CERT" >> "$GITHUB_ENV"
            "CSC_KEY_PASSWORD=$env:WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
            Write-Host "Code signing enabled (CSC_LINK set)."
          } else {
            Write-Host "No WINDOWS_CERTIFICATE secret set - installer stays unsigned until a code-signing cert is configured."
          }

      - name: Build the Windows installer
        run: npm run desktop:build

      - name: Publish the GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish-android:
    needs: publish-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 for the Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and stamp the version
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble the release APK
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --console=plain)

      - name: Resolve the version without the leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore the signing keystore
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
        run: |
          echo "$APK_KEYSTORE" | base64 -d > farkle-release.jks

      - name: Zipalign and sign the APK
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -n1)"
          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            Farkle-Setup.apk-aligned
          "$BT/apksigner" sign \
            --ks farkle-release.jks \
            --ks-key-alias "$APK_KEY_ALIAS" \
            --ks-pass "pass:$APK_KEYSTORE_PASSWORD" \
            --key-pass "pass:$APK_KEYSTORE_PASSWORD" \
            --out Farkle-${VERSION}.apk \
            Farkle-Setup.apk-aligned

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Farkle-*.apk
