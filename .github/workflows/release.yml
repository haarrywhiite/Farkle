name: Publish desktop + Android release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm the tag matches the app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer
        run: npm run desktop:build

      - name: Publish the GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  publish-android:
    needs: publish-windows
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17 for the Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies and stamp the version
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble the release APK
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --console=plain)

      - name: Resolve the version without the leading v
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Zipalign and sign the APK
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | tail -n1)
          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            Farkle-Setup.apk-aligned
          "$BT/apksigner" sign \
            --ks app/signing.keystore \
            --ks-key-alias my-key-alias \
            --ks-pass pass:hindRJE8Ic3r \
            --key-pass pass:hindRJE8Ic3r \
            --out Farkle-${VERSION}.apk \
            Farkle-Setup.apk-aligned

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Farkle-*.apk
